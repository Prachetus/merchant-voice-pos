<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice POS Prototype</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🎙️ Voice POS Panel</h1>
        <p>Tap the microphone and speak the order.</p>
        
        <button id="start-btn" class="mic-btn">Start Listening</button>
        
        <div class="result-box">
            <p id="output">Waiting for voice input...</p>
        </div>
    </div>

    <div style="margin-top: 40px; padding: 20px; border: 2px dashed #ccc; border-radius: 8px; max-width: 400px;">
        <h3>📦 Quick Restock Panel</h3>
        <p style="font-size: 14px; color: #666;">Add new shipments to inventory.</p>
        
        <label for="restockItem">Item Name:</label><br>
        <input type="text" id="restockItem" placeholder="e.g. loaf of bread" style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>

        <label for="restockQty">Quantity Received:</label><br>
        <input type="number" id="restockQty" placeholder="50" style="width: 100%; padding: 8px; margin-bottom: 15px;">

        <button onclick="submitRestock()" style="background-color: #3498db; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold;">
            Add to Inventory
        </button>
        
        <div id="restockOutput" style="margin-top: 15px; font-weight: bold;"></div>
    </div>

    <script src="{{ url_for('static', filename='js/voice.js') }}"></script>
</body>
</html>
